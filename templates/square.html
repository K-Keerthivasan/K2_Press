<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="{{ css_path }}">
  <style>
    html, body { width: 1080px; height: 1080px; }
    .slide    { width: 1080px; height: 1080px; }

    .layer {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 62px 70px 60px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-pill { display: flex; align-items: center; gap: 14px; }
    .brand-logo-img { width: 52px; height: 52px; border-radius: 50%; object-fit: contain; }
    .brand-name { font-size: 25px; font-weight: 700; color: #fff; }
    .handle-top { font-size: 20px; font-weight: 600; color: var(--teal); }

    .body-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 26px;
    }
    .headline {
      margin: 0;
      font-size: 76px;
      font-weight: 800;
      line-height: 0.99;
      letter-spacing: -1px;
      color: #fff;
      max-width: 900px;
    }
    .body {
      margin: 0;
      font-size: 36px;
      font-weight: 400;
      line-height: 1.26;
      color: rgba(255,255,255,0.9);
      white-space: pre-line;
      max-width: 880px;
    }
    .teal-rule { width: 58px; height: 3px; background: var(--teal); border-radius: 2px; }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-label { font-size: 20px; font-weight: 700; color: rgba(255,255,255,0.78); }
    .handle-foot { font-size: 20px; font-weight: 600; color: rgba(255,255,255,0.6); }
  </style>
</head>
<body>
<main class="slide">
  {% if background_image %}
  <img class="bg-image" src="{{ background_image }}" alt="">
  {% endif %}
  <img class="wm" src="{{ logo_path }}" alt="">

  <div class="layer">
    <div class="top-bar">
      <div class="brand-pill">
        <img class="brand-logo-img" src="{{ logo_path }}" alt="K2 Digital Media">
        <span class="brand-name">K2 Digital Media</span>
      </div>
      <span class="handle-top">{{ handle }}</span>
    </div>

    <div class="body-area">
      <h1 class="headline">{{ post.headline }}</h1>
      <span class="teal-rule"></span>
      <p class="body">{{ post.body }}</p>
    </div>

    <div class="bottom-bar">
      <span class="footer-label">K2 Digital Media</span>
      <span class="handle-foot">{{ handle }}</span>
    </div>
  </div>
</main>
</body>
</html>
