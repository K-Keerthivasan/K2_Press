<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="{{ css_path }}">
  <style>{{ theme_css }}</style>
  <style>
    .layer {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 76px 88px 80px;
    }

    .top-meta {
      display: flex;
      justify-content: center;
    }

    .body-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 26px;
    }
    .slide-num {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: 4px;
      color: var(--teal);
    }
    .card-heading {
      margin: 0;
      font-size: 62px;
      font-weight: 700;
      line-height: 1.04;
      text-transform: uppercase;
      letter-spacing: -1px;
      color: #fff;
    }
    .card-body {
      margin: 0;
      font-size: 32px;
      font-weight: 400;
      line-height: 1.4;
      color: rgba(255,255,255,0.88);
      white-space: pre-line;
      max-width: 860px;
    }

    .bottom-bar { display: flex; justify-content: center; }
  </style>
</head>
<body>
<main class="slide content-slide">
  {% if background_image %}
  <img class="bg-image" src="{{ background_image }}" alt="">
  {% endif %}
  <img class="wm" src="{{ logo_path }}" style="{{ wm_style }}" alt="">

  <div class="layer">
    {% set _meta = [brand.email, brand.website] | select | join(' · ') %}
    <div class="top-meta" style="{% if not _meta %}visibility:hidden{% endif %}">
      <span class="meta-line">{% if _meta %}· {{ _meta }}{% else %}&nbsp;{% endif %}</span>
    </div>

    <div class="body-area">
      <div class="slide-num">{{ "%02d"|format(slide_number) }}</div>
      <h2 class="card-heading">{{ slide.heading }}</h2>
      <p class="card-body">{{ slide.body }}</p>
    </div>

    <div class="bottom-bar" style="justify-content:{{ badge_justify }}">
      <div class="badge-brand">
        <img class="b-mark" src="{{ logo_path }}" alt="{{ brand.name }}">
        <span class="b-name">{{ brand.name }}</span>
      </div>
    </div>
  </div>
</main>
</body>
</html>
