<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="{{ css_path }}">
  <style>
    .layer {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 58px 76px 68px;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
    }
    .handle-sm {
      font-size: 21px;
      font-weight: 500;
      color: rgba(255,255,255,0.42);
    }

    .body-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 30px;
    }
    .slide-num {
      font-size: 23px;
      font-weight: 700;
      letter-spacing: 3px;
      color: var(--teal);
    }
    .card-heading {
      margin: 0;
      font-size: 82px;
      font-weight: 800;
      line-height: 0.96;
      text-transform: uppercase;
      letter-spacing: -1px;
      color: #fff;
    }
    .card-body {
      margin: 0;
      font-size: 40px;
      font-weight: 400;
      line-height: 1.28;
      color: rgba(255,255,255,0.90);
      white-space: pre-line;
    }

    .bottom-bar {
      display: flex;
      justify-content: flex-end;
      align-items: center;
      gap: 12px;
    }
    .footer-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
    }
    .footer-logo {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      object-fit: contain;
    }
    .footer-label {
      font-size: 20px;
      font-weight: 700;
      color: rgba(255,255,255,0.75);
    }
  </style>
</head>
<body>
<main class="slide content-slide">
  {% if background_image %}
  <img class="bg-image" src="{{ background_image }}" alt="">
  {% endif %}
  <img class="wm" src="{{ logo_path }}" alt="">

  <div class="layer">
    <div class="top-bar">
      <span class="handle-sm">{{ handle }}</span>
    </div>

    <div class="body-area">
      <div class="slide-num">0{{ slide_number }}</div>
      <h2 class="card-heading">{{ slide.heading }}</h2>
      <p class="card-body">{{ slide.body }}</p>
    </div>

    <div class="bottom-bar">
      <div class="footer-badge">
        <img class="footer-logo" src="{{ logo_path }}" alt="K2 Digital Media">
        <span class="footer-label">K2 Digital Media</span>
      </div>
    </div>
  </div>
</main>
</body>
</html>
