<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="{{ css_path }}">
  <style>{{ theme_css }}</style>
  <style>
    .layer {
      position: relative; z-index: 2; height: 100%;
      display: flex; flex-direction: column;
      padding: 80px 88px 78px;
    }
    .top-bar { display: flex; align-items: center; justify-content: space-between; }
    .handle-top { font-size: 22px; font-weight: 600; color: var(--teal); }

    .body-area {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; gap: 30px;
    }
    .qmark {
      font-size: 200px; line-height: 0.6; font-weight: 800;
      color: var(--teal); height: 96px;
    }
    .quote {
      margin: 0; font-size: 78px; font-weight: 800; line-height: 1.05;
      letter-spacing: -1.5px; color: #fff; max-width: 880px;
    }
    .context {
      margin: 0; font-size: 34px; font-weight: 400; line-height: 1.3;
      color: rgba(255,255,255,0.82); max-width: 820px;
    }
    .source {
      font-size: 22px; font-weight: 600; letter-spacing: 1px;
      color: rgba(255,255,255,0.5); text-transform: uppercase;
    }
    .bottom-bar { display: flex; justify-content: space-between; align-items: center; }
    .handle-foot { font-size: 20px; font-weight: 600; color: rgba(255,255,255,0.6); }
  </style>
</head>
<body class="brand-{{ brand.short|lower }}">
<main class="slide">
  {% if background_image %}<img class="bg-image" src="{{ background_image }}" alt="">{% endif %}
  <img class="wm" src="{{ logo_path }}" style="{{ wm_style }}" alt="">

  <div class="layer">
    <div class="top-bar">
      <div class="badge-brand">
        <img class="b-mark" src="{{ logo_path }}" alt="{{ brand.name }}">
        <span class="b-name">{{ brand.name }}</span>
      </div>
      <span class="handle-top">{{ handle }}</span>
    </div>

    <div class="body-area">
      <div class="qmark">&ldquo;</div>
      <h1 class="quote">{{ post.quote or post.headline or '' }}</h1>
      <span class="teal-rule"></span>
      {% if post.context %}<p class="context">{{ post.context }}</p>{% endif %}
      {% if post.source_label %}<span class="source">{{ post.source_label }}</span>{% endif %}
    </div>

    <div class="bottom-bar">
      <span class="handle-foot">{{ brand.tagline or brand.name }}</span>
      <span class="handle-foot">{{ handle }}</span>
    </div>
  </div>
</main>
</body>
</html>
