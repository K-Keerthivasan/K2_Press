<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="{{ css_path }}">
  <style>{{ theme_css }}</style>
  <style>
    .layer {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 84px 88px 88px;
    }

    .headline-wrap {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 26px;
    }
    .headline {
      margin: 0;
      font-size: 70px;
      font-weight: 700;
      line-height: 1.12;
      color: #fff;
      max-width: 880px;
      letter-spacing: -1.5px;
    }
    .subhead {
      margin: 0;
      font-size: 27px;
      font-weight: 400;
      color: rgba(255,255,255,0.62);
      line-height: 1.35;
      max-width: 760px;
    }

    .bottom {
      display: flex;
      justify-content: center;
    }
  </style>
</head>
<body>
<main class="slide title-slide">
  {% if background_image %}
  <img class="bg-image" src="{{ background_image }}" alt="">
  {% endif %}
  <img class="wm" src="{{ logo_path }}" style="{{ wm_style }}" alt="">

  <div class="layer">
    <div class="lockup">
      <img class="mark" src="{{ logo_path }}" alt="{{ brand.name }}">
      <div class="l-text">
        <span class="l-name">{{ brand.name }}</span>
        <span class="l-tag">{{ brand.tagline }}</span>
      </div>
    </div>

    <div class="headline-wrap">
      <h1 class="headline">{{ plan.title_card.headline }}</h1>
      {% if plan.title_card.subhead %}
      <span class="teal-rule"></span>
      <p class="subhead">{{ plan.title_card.subhead }}</p>
      {% endif %}
    </div>

    <div class="bottom">
      <span class="meta-line">{{ handle }}</span>
    </div>
  </div>
</main>
</body>
</html>
