<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="{{ css_path }}">
  <style>{{ theme_css }}</style>
  <style>
    .layer {
      position: relative; z-index: 2; height: 100%;
      display: flex; flex-direction: column;
      padding: 76px 80px 70px;
    }
    .top-bar { display: flex; align-items: center; justify-content: space-between; }
    .handle-top { font-size: 21px; font-weight: 600; color: var(--teal); }

    .banner {
      align-self: flex-start; margin-top: 40px;
      display: inline-flex; align-items: center; gap: 14px;
      background: var(--teal); color: var(--navy);
      font-size: 30px; font-weight: 800; letter-spacing: 2px;
      padding: 16px 28px; border-radius: 8px; text-transform: uppercase;
    }
    .banner .dot {
      width: 16px; height: 16px; border-radius: 50%;
      background: var(--navy); opacity: 0.85;
    }

    .body-area {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; gap: 30px;
    }
    .headline {
      margin: 0; font-size: 84px; font-weight: 800; line-height: 1.0;
      letter-spacing: -2px; color: #fff; max-width: 920px;
    }
    .take {
      margin: 0; font-size: 38px; font-weight: 400; line-height: 1.28;
      color: rgba(255,255,255,0.9); max-width: 880px;
      border-left: 5px solid var(--teal); padding-left: 26px;
    }

    .bottom-bar { display: flex; justify-content: space-between; align-items: center; }
    .handle-foot { font-size: 20px; font-weight: 600; color: rgba(255,255,255,0.62); }
  </style>
</head>
<body class="brand-{{ brand.short|lower }}">
<main class="slide">
  {% if background_image %}<img class="bg-image" src="{{ background_image }}" alt="">{% endif %}
  <img class="wm" src="{{ logo_path }}" style="{{ wm_style }}" alt="">

  <div class="layer">
    <div class="top-bar">
      <div class="badge-brand">
        <img class="b-mark" src="{{ logo_path }}" alt="{{ brand.name }}">
        <span class="b-name">{{ brand.name }}</span>
      </div>
      <span class="handle-top">{{ handle }}</span>
    </div>

    <div class="banner"><span class="dot"></span>{{ post.banner or 'BREAKING' }}</div>

    <div class="body-area">
      <h1 class="headline">{{ post.headline or '' }}</h1>
      {% if post.take %}<p class="take">{{ post.take }}</p>{% endif %}
    </div>

    <div class="bottom-bar">
      <span class="handle-foot">{{ brand.name }}</span>
      <span class="handle-foot">{{ handle }}</span>
    </div>
  </div>
</main>
</body>
</html>
