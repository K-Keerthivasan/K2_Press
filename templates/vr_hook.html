<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>{{ theme_css }}</style>
  <style>
    /* Transparent overlay — the video shows through; only bars/text are opaque.
       Rendered to a transparent PNG (Playwright omit_background) and composited
       over the 9:16 clip by ffmpeg. */
    html, body { margin:0; width:1080px; height:1920px; background:transparent;
                 font-family: Calibri, 'Segoe UI', sans-serif; }
    .frame { position:relative; width:1080px; height:1920px; }

    /* Top brand bar: navy → transparent gradient */
    .top-bar {
      position:absolute; top:0; left:0; right:0; height:260px;
      background: linear-gradient(180deg, var(--navy) 0%, rgba(10,15,30,0.0) 100%);
      display:flex; align-items:flex-start; gap:18px;
      padding:70px 70px 0;
    }
    .logo { width:64px; height:64px; border-radius:50%; object-fit:contain; }
    .brand-name { font-size:30px; font-weight:800; color:#fff; line-height:64px; }
    .handle { margin-left:auto; font-size:26px; font-weight:700; color:var(--teal); line-height:64px; }

    /* Bottom caption bar: white card, hook line with highlighted keywords */
    .cap-wrap { position:absolute; left:0; right:0; bottom:300px; padding:0 70px; }
    .cap {
      background:#fff; border-radius:28px; padding:44px 48px;
      box-shadow:0 16px 50px rgba(0,0,0,.45);
    }
    .lead { font-size:34px; font-weight:800; color:var(--teal); margin:0 0 12px; letter-spacing:.5px; }
    .body { font-size:52px; font-weight:800; color:#0A0F1E; line-height:1.12; margin:0; }
    .hl { color:var(--teal); }
    .hl.alt { color:var(--green); }
    .emoji { font-size:54px; }
  </style>
</head>
<body>
  <div class="frame">
    <div class="top-bar">
      <img class="logo" src="{{ logo_path }}" alt="">
      <span class="brand-name">{{ brand.name }}</span>
      <span class="handle">{{ handle }}</span>
    </div>
    <div class="cap-wrap">
      <div class="cap">
        {% if lead %}<p class="lead">{{ lead }}</p>{% endif %}
        <p class="body">{{ body_html }} {% if emoji %}<span class="emoji">{{ emoji }}</span>{% endif %}</p>
      </div>
    </div>
  </div>
</body>
</html>
