<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="{{ css_path }}">
  <style>{{ theme_css }}</style>
  <style>
    html, body { width: 1080px; height: 1920px; }
    .slide    { width: 1080px; height: 1920px; }

    /* Story-safe zone: keep key content away from the top/bottom ~220px
       where the platform overlays profile + reply UI. */
    .layer {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 230px 80px 240px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-pill { display: flex; align-items: center; gap: 16px; }
    .brand-logo-img { width: 60px; height: 60px; border-radius: 50%; object-fit: contain; }
    .brand-name { font-size: 28px; font-weight: 700; color: #fff; }
    .handle-top { font-size: 23px; font-weight: 600; color: var(--teal); }

    .body-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 34px;
    }
    .headline {
      margin: 0;
      font-size: 96px;
      font-weight: 800;
      line-height: 1.0;
      letter-spacing: -1px;
      color: #fff;
    }
    .body {
      margin: 0;
      font-size: 42px;
      font-weight: 400;
      line-height: 1.3;
      color: rgba(255,255,255,0.92);
      white-space: pre-line;
    }
    .teal-rule { width: 64px; height: 4px; background: var(--teal); border-radius: 2px; }

    .cta-pill {
      align-self: flex-start;
      margin-top: 8px;
      padding: 18px 36px;
      border-radius: 50px;
      background: var(--teal);
      color: #04202a;
      font-size: 32px;
      font-weight: 800;
    }

    .bottom-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 14px;
    }
    .footer-logo { width: 46px; height: 46px; border-radius: 50%; object-fit: contain; }
    .footer-label { font-size: 24px; font-weight: 700; color: rgba(255,255,255,0.8); }
  </style>
</head>
<body>
<main class="slide">
  {% if background_image %}
  <img class="bg-image" src="{{ background_image }}" alt="">
  {% endif %}
  <img class="wm" src="{{ logo_path }}" style="{{ wm_style }}" alt="">

  <div class="layer">
    <div class="top-bar">
      <div class="brand-pill">
        <img class="brand-logo-img" src="{{ logo_path }}" alt="{{ brand.name }}">
        <span class="brand-name">{{ brand.name }}</span>
      </div>
      <span class="handle-top">{{ handle }}</span>
    </div>

    <div class="body-area">
      <h1 class="headline">{{ post.headline }}</h1>
      <span class="teal-rule"></span>
      <p class="body">{{ post.body }}</p>
      {% if post.cta %}<div class="cta-pill">{{ post.cta }}</div>{% endif %}
    </div>

    <div class="bottom-bar">
      <img class="footer-logo" src="{{ logo_path }}" alt="">
      <span class="footer-label">{{ handle }}</span>
    </div>
  </div>
</main>
</body>
</html>
