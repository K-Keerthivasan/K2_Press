<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="{{ css_path }}">
  <style>{{ theme_css }}</style>
  <style>
    .title-slide::before { display: none; }
    .layer {
      position: relative; z-index: 2; height: 100%;
      display: flex; flex-direction: column;
      padding: 70px 72px 64px;
    }

    .top-row { display: flex; align-items: center; justify-content: space-between; }
    .brand-logo { height: 40px; width: auto; object-fit: contain; }
    .handle { font-size: 22px; font-weight: 500; color: rgba(255,255,255,0.6); }

    .headline {
      margin: 30px 0 26px;
      font-size: 66px; font-weight: 700; line-height: 1.05;
      letter-spacing: -1.5px; color: #fff; text-transform: uppercase;
    }

    .hero-wrap {
      position: relative; flex: 1; min-height: 0;
      border-radius: 22px; overflow: hidden;
      border: 1px solid rgba(255,255,255,0.10);
      box-shadow: 0 24px 60px rgba(0,0,0,0.5);
    }
    .hero-wrap .hero { width: 100%; height: 100%; object-fit: cover; filter: saturate(1.1) contrast(1.05); }
    .hero-wrap .placeholder { position:absolute; inset:0; background: linear-gradient(135deg, var(--teal), var(--navy)); }
    .hero-wrap .accent-bar { position: absolute; left: 0; bottom: 0; height: 8px; width: 100%; background: var(--teal); }

    .caption {
      margin: 26px 0 0;
      font-size: 30px; font-weight: 400; line-height: 1.3;
      color: rgba(255,255,255,0.74); text-align: center;
    }
  </style>
</head>
<body>
<main class="slide title-slide">
  <div class="layer">
    <div class="top-row">
      <img class="brand-logo" src="{{ logo_path }}" alt="{{ brand.name }}">
      <span class="handle">{{ handle }}</span>
    </div>

    <h1 class="headline">{{ plan.title_card.headline }}</h1>

    <div class="hero-wrap">
      {% if background_image %}
      <img class="hero" src="{{ background_image }}" alt="">
      {% else %}
      <div class="placeholder"></div>
      {% endif %}
      <span class="accent-bar"></span>
    </div>

    {% if plan.title_card.subhead %}
    <p class="caption">{{ plan.title_card.subhead }}</p>
    {% endif %}
  </div>
</main>
</body>
</html>
