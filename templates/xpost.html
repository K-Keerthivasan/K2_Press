<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="{{ css_path }}">
  <style>{{ theme_css }}</style>
  <style>
    html, body { width: 1600px; height: 900px; }
    .slide    { width: 1600px; height: 900px; }
    .wm { width: 520px; height: 520px; right: -60px; bottom: -90px; }

    .layer {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 64px 80px 58px;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .brand-pill { display: flex; align-items: center; gap: 16px; }
    .brand-logo-img { width: 56px; height: 56px; border-radius: 50%; object-fit: contain; }
    .brand-name { font-size: 27px; font-weight: 700; color: #fff; }
    .handle-top { font-size: 23px; font-weight: 600; color: var(--teal); }

    .body-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
      max-width: 1150px;
    }
    .headline {
      margin: 0;
      font-size: 84px;
      font-weight: 800;
      line-height: 1.0;
      letter-spacing: -1px;
      color: #fff;
    }
    .body {
      margin: 0;
      font-size: 38px;
      font-weight: 400;
      line-height: 1.26;
      color: rgba(255,255,255,0.9);
      white-space: pre-line;
    }
    .teal-rule { width: 64px; height: 4px; background: var(--teal); border-radius: 2px; }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-label { font-size: 22px; font-weight: 700; color: rgba(255,255,255,0.78); }
    .handle-foot { font-size: 22px; font-weight: 600; color: rgba(255,255,255,0.6); }
  </style>
</head>
<body>
<main class="slide">
  {% if background_image %}
  <img class="bg-image" src="{{ background_image }}" alt="">
  {% endif %}
  <img class="wm" src="{{ logo_path }}" alt="">

  <div class="layer">
    <div class="top-bar">
      <div class="brand-pill">
        <img class="brand-logo-img" src="{{ logo_path }}" alt="{{ brand.name }}">
        <span class="brand-name">{{ brand.name }}</span>
      </div>
      <span class="handle-top">{{ handle }}</span>
    </div>

    <div class="body-area">
      <h1 class="headline">{{ post.headline }}</h1>
      <span class="teal-rule"></span>
      <p class="body">{{ post.body }}</p>
    </div>

    <div class="bottom-bar">
      <span class="footer-label">{{ brand.name }}</span>
      <span class="handle-foot">{{ handle }}</span>
    </div>
  </div>
</main>
</body>
</html>
