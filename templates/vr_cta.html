<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>{{ theme_css }}</style>
  <style>
    /* CTA overlay — transparent; ffmpeg dims the clip with a vignette underneath. */
    html, body { margin:0; width:100%; height:100%; background:transparent;
                 font-family: Calibri, 'Segoe UI', sans-serif; }
    .frame { position:relative; width:100%; height:100%; }

    /* Centred CTA line */
    .cta-wrap { position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
                padding:0 110px; }
    .cta { font-size:78px; font-weight:900; color:#fff; line-height:1.06; text-align:center;
           letter-spacing:-1px; text-shadow:0 4px 28px rgba(0,0,0,.7); margin:0; }
    .hl { color:var(--teal); }
    .hl.alt { color:var(--green); }

    /* Logo + handle bottom-right */
    .footer { position:absolute; right:70px; bottom:9vh; display:flex; align-items:center; gap:16px; }
    .footer img { width:60px; height:60px; border-radius:50%; object-fit:contain; }
    .footer span { font-size:30px; font-weight:800; color:var(--teal); text-shadow:0 2px 12px rgba(0,0,0,.6); }
  </style>
</head>
<body>
  <div class="frame">
    <div class="cta-wrap"><p class="cta">{{ body_html }}</p></div>
    <div class="footer"><img src="{{ logo_path }}" alt=""><span>{{ handle }}</span></div>
  </div>
</body>
</html>
