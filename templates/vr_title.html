<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>{{ theme_css }}</style>
  <style>
    /* Full-bleed title overlay — transparent; ffmpeg composites over the clip. */
    html, body { margin:0; width:100%; height:100%; background:transparent;
                 font-family: Calibri, 'Segoe UI', sans-serif; }
    .frame { position:relative; width:100%; height:100%; }

    /* Logo divider line across mid-frame */
    .divider { position:absolute; top:50%; left:0; right:0; display:flex;
               align-items:center; gap:24px; padding:0 70px; transform:translateY(-50%); }
    .divider .rule { flex:1; height:4px; background:linear-gradient(90deg, transparent, var(--teal), transparent); }
    .divider .mark { width:72px; height:72px; border-radius:50%; object-fit:contain;
                     box-shadow:0 0 0 6px rgba(10,15,30,.55); }

    /* Title lower-third */
    .lower { position:absolute; left:0; right:0; bottom:17vh; padding:0 70px; }
    .title { font-size:104px; font-weight:900; color:#fff; line-height:.98; margin:0;
             letter-spacing:-2px; text-shadow:0 4px 24px rgba(0,0,0,.6); }
    .subtitle { font-size:46px; font-weight:700; color:rgba(255,255,255,.92); margin:18px 0 0;
                text-shadow:0 2px 16px rgba(0,0,0,.6); }
    .hl { color:var(--teal); }
    .hl.alt { color:var(--green); }

    /* Logo bottom-left */
    .footer { position:absolute; left:70px; bottom:9vh; display:flex; align-items:center; gap:16px; }
    .footer img { width:56px; height:56px; border-radius:50%; object-fit:contain; }
    .footer span { font-size:28px; font-weight:800; color:#fff; text-shadow:0 2px 12px rgba(0,0,0,.6); }
  </style>
</head>
<body>
  <div class="frame">
    <div class="divider"><span class="rule"></span><img class="mark" src="{{ logo_path }}" alt=""><span class="rule"></span></div>
    <div class="lower">
      <h1 class="title">{{ title_html }}</h1>
      {% if subtitle %}<p class="subtitle">{{ subtitle_html }}</p>{% endif %}
    </div>
    <div class="footer"><img src="{{ logo_path }}" alt=""><span>{{ brand.name }}</span></div>
  </div>
</body>
</html>
