<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="{{ css_path }}">
  <style>{{ theme_css }}</style>
  <style>
    .layer {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 76px 88px 80px;
    }

    .top-meta { display: flex; justify-content: center; }

    .cta-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 30px;
    }
    .cta-heading {
      margin: 0;
      font-size: 58px;
      font-weight: 700;
      line-height: 1.12;
      color: #fff;
      max-width: 840px;
      letter-spacing: -1px;
    }
    .cta-action {
      margin: 0;
      font-size: 34px;
      font-weight: 500;
      color: rgba(255,255,255,0.9);
      white-space: pre-line;
    }

    .bottom-bar { display: flex; justify-content: center; }
  </style>
</head>
<body>
<main class="slide outro-bg">
  {% if background_image %}
  <img class="bg-image" src="{{ background_image }}" alt="">
  {% endif %}
  <img class="wm" src="{{ logo_path }}" style="{{ wm_style }}" alt="">

  <div class="layer">
    <div class="top-meta" style="{% if not brand.website %}visibility:hidden{% endif %}">
      <span class="meta-line">{% if brand.website %}· {{ brand.website }}{% else %}&nbsp;{% endif %}</span>
    </div>

    <div class="cta-area">
      <h2 class="cta-heading">{{ plan.outro_card.cta }}</h2>
      <p class="cta-action">{{ plan.outro_card.handle }}</p>
    </div>

    <div class="bottom-bar" style="justify-content:{{ badge_justify }}">
      <div class="badge-brand">
        <img class="b-mark" src="{{ logo_path }}" alt="{{ brand.name }}">
        <span class="b-name">{{ brand.name }}</span>
      </div>
    </div>
  </div>
</main>
</body>
</html>
