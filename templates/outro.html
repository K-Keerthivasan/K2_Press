<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="{{ css_path }}">
  <style>
    .layer {
      position: relative;
      z-index: 2;
      height: 100%;
      display: flex;
      flex-direction: column;
      padding: 58px 76px 68px;
    }

    .top-bar {
      display: flex;
      justify-content: flex-end;
    }
    .handle-sm {
      font-size: 21px;
      font-weight: 500;
      color: rgba(255,255,255,0.55);
    }

    .cta-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 36px;
    }
    .cta-heading {
      margin: 0;
      font-size: 86px;
      font-weight: 800;
      line-height: 0.97;
      color: #fff;
      max-width: 840px;
      letter-spacing: -1px;
    }
    .cta-action {
      margin: 0;
      font-size: 46px;
      font-weight: 700;
      color: rgba(255,255,255,0.90);
      white-space: pre-line;
    }

    .bottom-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-badge {
      display: inline-flex;
      align-items: center;
      gap: 11px;
    }
    .footer-logo {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      object-fit: contain;
    }
    .footer-label {
      font-size: 21px;
      font-weight: 700;
      color: rgba(255,255,255,0.85);
    }
    .handle-footer {
      font-size: 25px;
      font-weight: 700;
      color: rgba(255,255,255,0.68);
    }
  </style>
</head>
<body>
<main class="slide outro-bg">
  {% if background_image %}
  <img class="bg-image" src="{{ background_image }}" alt="">
  {% endif %}
  <img class="wm" src="{{ logo_path }}" alt="">

  <div class="layer">
    <div class="top-bar">
      <span class="handle-sm">{{ handle }}</span>
    </div>

    <div class="cta-area">
      <h2 class="cta-heading">{{ plan.outro_card.cta }}</h2>
      <p class="cta-action">{{ plan.outro_card.handle }}</p>
    </div>

    <div class="bottom-bar">
      <div class="footer-badge">
        <img class="footer-logo" src="{{ logo_path }}" alt="K2 Digital Media">
        <span class="footer-label">K2 Digital Media</span>
      </div>
      <span class="handle-footer">{{ handle }}</span>
    </div>
  </div>
</main>
</body>
</html>
