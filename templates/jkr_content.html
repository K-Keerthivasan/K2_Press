<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="{{ css_path }}">
  <style>{{ theme_css }}</style>
  <style>
    .content-slide::before { display: none; }     /* custom layout, no global vignette */
    .layer { position: relative; z-index: 2; height: 100%; display: flex; flex-direction: column; }

    /* ── Top half: full-colour hero image ─────────────────────────────── */
    .img-half {
      position: relative;
      height: 54%;
      overflow: hidden;
    }
    .img-half .hero {
      position: absolute; inset: 0;
      width: 100%; height: 100%;
      object-fit: cover;
      /* keep it punchy and colourful (no heavy desaturation) */
      filter: saturate(1.08) contrast(1.04);
    }
    .img-half .placeholder {
      position: absolute; inset: 0;
      background: linear-gradient(135deg, var(--teal) 0%, var(--navy) 90%);
    }
    /* blend the image into the text area below */
    .img-fade {
      position: absolute; left: 0; right: 0; bottom: 0; height: 240px;
      background: linear-gradient(180deg, rgba(11,11,15,0) 0%, var(--navy) 100%);
    }
    .num-chip {
      position: absolute; top: 54px; left: 70px;
      display: inline-flex; align-items: center; gap: 10px;
      padding: 8px 16px; border-radius: 30px;
      background: var(--teal); color: #fff;
      font-size: 22px; font-weight: 700; letter-spacing: 2px;
    }

    /* ── Bottom half: copy ────────────────────────────────────────────── */
    .text-half {
      flex: 1;
      display: flex; flex-direction: column;
      padding: 8px 70px 64px;
    }
    .heading {
      margin: 0 0 22px;
      font-size: 60px; font-weight: 700; line-height: 1.02;
      text-transform: uppercase; letter-spacing: -1px; color: #fff;
    }
    .body {
      margin: 0;
      font-size: 31px; font-weight: 400; line-height: 1.42;
      color: rgba(255,255,255,0.9); white-space: pre-line;
    }
    .footer { margin-top: auto; display: flex; }
    .b-logo { height: 38px; width: auto; object-fit: contain; }
  </style>
</head>
<body>
<main class="slide content-slide">
  <div class="layer">
    <div class="img-half">
      {% if background_image %}
      <img class="hero" src="{{ background_image }}" alt="">
      {% else %}
      <div class="placeholder"></div>
      {% endif %}
      <div class="img-fade"></div>
      <span class="num-chip">{{ "%02d"|format(slide_number) }}</span>
    </div>

    <div class="text-half">
      <h2 class="heading">{{ slide.heading }}</h2>
      <p class="body">{{ slide.body }}</p>
      <div class="footer" style="justify-content:{{ badge_justify }}">
        <img class="b-logo" src="{{ logo_path }}" alt="{{ brand.name }}">
      </div>
    </div>
  </div>
</main>
</body>
</html>
