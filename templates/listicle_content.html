<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="{{ css_path }}">
  <style>{{ theme_css }}</style>
  <style>
    .layer {
      position: relative; z-index: 2; height: 100%;
      display: flex; flex-direction: column;
      padding: 76px 88px 80px;
    }
    .top-meta { display: flex; justify-content: center; }

    .body-area {
      flex: 1; display: flex; flex-direction: column;
      justify-content: center; gap: 18px;
    }
    .rank-row { display: flex; align-items: baseline; gap: 22px; }
    .rank-hash { font-size: 64px; font-weight: 700; color: var(--teal); line-height: 1; }
    .rank-num {
      font-size: 188px; font-weight: 800; line-height: 0.8;
      letter-spacing: -6px; color: var(--teal);
      -webkit-text-stroke: 2px var(--teal);
    }
    .card-heading {
      margin: 4px 0 0; font-size: 64px; font-weight: 700; line-height: 1.02;
      text-transform: uppercase; letter-spacing: -1px; color: #fff; max-width: 900px;
    }
    .card-body {
      margin: 0; font-size: 32px; font-weight: 400; line-height: 1.4;
      color: rgba(255,255,255,0.88); white-space: pre-line; max-width: 860px;
    }

    .bottom-bar { display: flex; justify-content: center; }
  </style>
</head>
<body class="brand-{{ brand.short|lower }} listicle">
<main class="slide content-slide">
  {% if background_image %}<img class="bg-image" src="{{ background_image }}" alt="">{% endif %}
  <img class="wm" src="{{ logo_path }}" style="{{ wm_style }}" alt="">

  <div class="layer">
    {% set _meta = [brand.email, brand.website] | select | join(' · ') %}
    <div class="top-meta" style="{% if not _meta %}visibility:hidden{% endif %}">
      <span class="meta-line">{% if _meta %}· {{ _meta }}{% else %}&nbsp;{% endif %}</span>
    </div>

    <div class="body-area">
      <div class="rank-row">
        <span class="rank-hash">#</span>
        <span class="rank-num">{{ slide.rank if slide.rank is not none else slide_number }}</span>
      </div>
      <h2 class="card-heading">{{ slide.heading }}</h2>
      <span class="teal-rule"></span>
      <p class="card-body">{{ slide.body }}</p>
    </div>

    <div class="bottom-bar" style="justify-content:{{ badge_justify }}">
      <div class="badge-brand">
        <img class="b-mark" src="{{ logo_path }}" alt="{{ brand.name }}">
        <span class="b-name">{{ brand.name }}</span>
      </div>
    </div>
  </div>
</main>
</body>
</html>
