llm:
  # Active backend on boot. Switch live in the header "Engine" dropdown.
  # base_url/model below are the effective defaults (env K2_LLM_* still wins on boot).
  base_url: "hermes://cli"
  model:    "hermes:gpt-5.5"
  format:   "json"
  # Selectable backends (the Engine dropdown). Override host/model per machine here.
  backends:
    hermes:
      base_url: "hermes://cli"
      model:    "hermes:gpt-5.5"
    ollama:
      base_url: "http://localhost:11434/v1"
      model:    "qwen3:8b"

output:
  width:     1080
  height:    1350
  directory: "outputs"

# ── Image sourcing ────────────────────────────────────────────────────────────
# Sources: pexels, unsplash, google (Programmable Search — needs GOOGLE_API_KEY
# and GOOGLE_CSE_ID in .env). The "slight filter" below is baked into web/Google
# images on download (Pillow). Tune globally here, or override per brand with a
# brand-level `image_filter:` block (same keys). Set enabled:false to skip it.
images:
  filter:
    enabled:    true
    saturation: 0.85   # <1 = less saturated
    brightness: 0.95   # <1 = darker
    contrast:   1.05   # >1 = punchier

slides:
  min_content_cards: 1    # min total = 3 (title + 1 + outro)
  max_content_cards: 8    # max total = 10 (title + 8 + outro)
  default_total:     4    # default total slides
  short_story:
    max_summary_words: 220
    content_cards:     2
  long_story:
    min_summary_words: 221
    content_cards:     4

# Post formats. "carousel" is multi-slide; the rest are single-card posts.
formats:
  carousel:
    name:   "Carousel"
    width:  1080
    height: 1350
    type:   multi
  cover:
    name:     "Brand Cover"
    width:    1080
    height:   1350
    type:     single
    template: cover.html
  square:
    name:     "Square Post"
    width:    1080
    height:   1080
    type:     single
    template: square.html
  story:
    name:     "Story"
    width:    1080
    height:   1920
    type:     single
    template: story.html
  x:
    name:     "X / Twitter"
    width:    1600
    height:   900
    type:     single
    template: xpost.html
  # ── New post types (both brands, themed) ───────────────────────────────────
  quote:
    name:     "Quote / Stat"
    width:    1080
    height:   1350
    type:     single
    template: quote.html
  comparison:
    name:     "Comparison / VS"
    width:    1080
    height:   1350
    type:     single
    template: comparison.html
  breaking:
    name:     "Breaking / Hot Take"
    width:    1080
    height:   1350
    type:     single
    template: breaking.html
  listicle:
    name:   "Listicle / Top-N"
    width:  1080
    height: 1350
    type:   multi
  linkedin:
    name:     "LinkedIn (K2)"
    width:    1200
    height:   1200
    type:     single
    template: linkedin.html
    brands:   ["k2"]      # K2-only single hot-take post
