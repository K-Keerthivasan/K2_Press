app:
  name: "K2 Studio"

# Which brand the app is currently posting for. Switch in the header dropdown.
active_brand: k2

# ── Brands ────────────────────────────────────────────────────────────────────
# Each brand carries its own copy, theme colours, scoring profile, and RSS feeds.
# Templates are shared — only the brand vars + theme change.
brands:

  k2:
    name:      "K2 Digital Media"
    short:     "K2"
    author:    "Keerthivasan"
    handle:    "@k2digitalmedia_"
    instagram: "k2digitalmedia_"
    tagline:   "The complete online presence for local business"
    pitch:     "One agency. Four services."
    services:  "Web · Video · Marketing · IT"
    location:  "London, Ontario"
    website:   "k2digitalmedia.ca"
    email:     "info@k2digitalmedia.ca"
    category:  "WEB DEVELOPMENT"
    logo_path: "static/logo.png"
    hashtags:  ["london", "ontario", "digitalmedia"]
    theme:
      navy:    "#0A0F1E"   # background base
      navy2:   "#0C1426"
      accent:  "#00B4C8"   # teal
      accent2: "#00C896"   # green
      text:    "#FFFFFF"
    # ── Video / Reels (branded 9:16 export) ──────────────────────────────────
    video:
      enabled: true
      color_grade:
        overlay: "#0A0F1E"   # navy tint blended over the clip
        opacity: 0.15        # 0 = none, 1 = solid
      captions:
        font_size:  54       # at 1080px width
        text_color: "#FFFFFF"
        box_opacity: 0.55    # dark pill behind the words (0 = off)
        position:   0.74     # vertical centre as a fraction of height
      hook_card:
        enabled:    true
        duration:   2.0      # seconds at the start
        bg:         "#0A0F1E"
        text_color: "#FFFFFF"
        accent:     "#00B4C8"
      end_card:
        enabled:    true
        duration:   3.0      # seconds at the end
        bg:         "#0A0F1E"
        text_color: "#FFFFFF"
        accent:     "#00B4C8"
        cta:        "Link in bio · k2digitalmedia.ca"
    profile: >
      K2 Digital Media is a full-service digital agency in London, Ontario, Canada
      (web development & design, video & VFX, digital marketing & SEO, and IT).
      It posts practical, trend-aware content positioning the agency as the local
      expert for small and mid-sized businesses. Reward stories on web dev, design,
      SEO/marketing, short-form video, and tech/business trends that can be made
      actionable for a local business owner. Penalise hard news, crime, politics,
      and gossip. Audience: business owners, marketers, and founders in SW Ontario.
    personality: >
      Voice: practical local expert, confident operator, helpful strategist. Write
      like a sharp London Ontario agency owner explaining what matters to a busy
      business owner. Use concrete business outcomes: leads, trust, speed, ranking,
      bookings, retention, and wasted spend. Avoid generic marketing slogans,
      internet hype, and vague "game changer" language.
    feeds:
      categories:
        web_development:
          name:    "Web Development & Design"
          enabled: true
          urls:
            - "https://www.smashingmagazine.com/feed"
            - "https://css-tricks.com/feed"
            - "https://blog.codepen.io/feed"
            - "https://github.blog/feed"
            - "https://stackoverflow.blog/feed"
        digital_marketing:
          name:    "Digital Marketing & SEO"
          enabled: true
          urls:
            - "https://moz.com/feeds/blog.rss"
            - "https://blog.hubspot.com/marketing/rss.xml"
            - "https://searchengineland.com/feed"
            - "https://www.marketingdive.com/feeds/news"
            - "https://digitalagencynetwork.com/feed"
        tech_business:
          name:    "Tech & Business"
          enabled: true
          urls:
            - "https://techcrunch.com/feed"
        ai:
          name:    "AI & Machine Learning"
          enabled: true
          urls:
            - "https://openai.com/news/rss.xml"
            - "https://blog.google/technology/ai/rss/"
            - "https://deepmind.google/blog/rss.xml"
            - "https://news.mit.edu/rss/topic/artificial-intelligence2"
            - "https://techcrunch.com/category/artificial-intelligence/feed/"
            - "https://venturebeat.com/category/ai/feed/"
            - "https://huggingface.co/blog/feed.xml"
        cybersecurity:
          name:    "Cybersecurity"
          enabled: true
          urls:
            - "https://www.bleepingcomputer.com/feed/"
            - "https://feeds.feedburner.com/TheHackersNews"
            - "https://krebsonsecurity.com/feed/"
            - "https://www.securityweek.com/feed/"
            - "https://www.darkreading.com/rss.xml"
        youtube:
          name:    "YouTube"
          enabled: true
          urls:
            - "https://www.youtube.com/feeds/videos.xml?channel_id=UC2Xd-TjJByJyK2w1zNwY0zQ"   # Fireship
            - "https://www.youtube.com/feeds/videos.xml?channel_id=UCFbNIlppjAuEX4znoulh0Cw"   # Web Dev Simplified
            - "https://www.youtube.com/feeds/videos.xml?channel_id=UCGcAPjsNRj2BwCHM1xzFUeQ"   # Ahrefs
            - "https://www.youtube.com/feeds/videos.xml?channel_id=UCkWVA1_vkY9GLyuLAre97AQ"   # HubSpot Marketing
            - "https://www.youtube.com/feeds/videos.xml?channel_id=UChpleBmo18P08aKCIgti38g"   # Matt Wolfe
            - "https://www.youtube.com/feeds/videos.xml?channel_id=UCbfYPyITQ-7l4upoX8nvctg"   # Two Minute Papers

  jkr:
    name:      "JKR"
    short:     "JKR"
    author:    "Keerthivasan"
    handle:    "@jkr_studio_"
    instagram: "jkr_studio_"
    tagline:   "Games & film, decoded."
    pitch:     "Gaming. Movies. Culture."
    services:  "Games · Film · Reviews · News"
    location:  ""
    website:   ""
    email:     ""
    category:  "GAMING"
    logo_path: "static/logo_jkr.png"
    logo_shape: "wide"        # full wordmark (don't crop to a circle)
    image_forward: true       # image-led layouts (image + text split)
    hashtags:  ["gaming", "games", "film", "movies"]
    templates:
      title:   jkr_title.html
      content: jkr_content.html
      outro:   jkr_outro.html
      cover:   cover.html
    theme:
      navy:    "#0B0B0F"   # near-black background
      navy2:   "#141418"
      accent:  "#ED1C24"   # JKR red
      accent2: "#FF5A4D"
      text:    "#FFFFFF"
    # ── Video / Reels (branded 9:16 export) ──────────────────────────────────
    video:
      enabled: true
      color_grade:
        overlay: "#0B0B0F"   # near-black tint blended over the clip
        opacity: 0.18
      captions:
        font_size:  54
        text_color: "#FFFFFF"
        box_opacity: 0.55
        position:   0.74
      hook_card:
        enabled:    true
        duration:   2.0
        bg:         "#0B0B0F"
        text_color: "#FFFFFF"
        accent:     "#ED1C24"
      end_card:
        enabled:    true
        duration:   3.0
        bg:         "#0B0B0F"
        text_color: "#FFFFFF"
        accent:     "#ED1C24"
        cta:        "Follow @jkr_studio_"
    profile: >
      JKR is a gaming and film/entertainment page. It posts fast, opinionated,
      fan-facing content about video games (AAA + indie, releases, trailers,
      patches, studio news, leaks) and movies/TV (releases, casting, box office,
      trailers, festival and awards news, reviews). Reward breaking news, trailers,
      release dates, big industry moves, and strong takes that fans care about.
      Penalise dry corporate filings with no fan angle, and unrelated hard news.
    personality: >
      Voice: fan-first, fast, opinionated, and cinematic. Write like a games and
      film page that understands hype cycles but still has taste. Use punchy
      reactions, clear stakes for players/viewers, and confident takes. Avoid
      corporate PR wording, dry summaries, and empty hype.
    feeds:
      categories:
        video_games:
          name:    "Video Games"
          enabled: true
          urls:
