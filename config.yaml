          urls:
            - "https://www.youtube.com/feeds/videos.xml?channel_id=UCKy1dAqELo0zrOtPkf0eTMw"   # IGN
            - "https://www.youtube.com/feeds/videos.xml?channel_id=UC5CE6nbu1tjSGha-a_cHAFA"   # GameSpot
            - "https://www.youtube.com/feeds/videos.xml?channel_id=UCpFHkjOa7ia6bH5_6cDsDXg"   # Gameranx
            - "https://www.youtube.com/feeds/videos.xml?channel_id=UC9Kq-yEt1iYsbUzNOoIRK0g"   # Screen Rant
            - "https://www.youtube.com/feeds/videos.xml?channel_id=UC7yRILFFJ2QZCykymr8LPwA"   # New Rockstars
