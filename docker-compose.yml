services:
  k2-posttool:
    build: .
    container_name: k2-posttool
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      OLLAMA_BASE_URL: "http://host.docker.internal:11434/v1"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./outputs:/app/outputs
      - ./image_cache:/app/image_cache
      - ./library:/app/library
      - ./config.yaml:/app/config.host.yaml:ro
      - ./content_profile.md:/app/content_profile.md
      - ./templates:/app/templates
      - ./static:/app/static
      - ./Assets:/app/Assets
    restart: unless-stopped
